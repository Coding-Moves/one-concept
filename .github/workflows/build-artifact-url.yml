# Ops helper (temporary): print the downloadable artifact URL for an EAS build.
# Metadata query only (eas build:list) — starts no build, uses no build quota.
# Needs EXPO_TOKEN because the project's builds are not public.
name: Build artifact URL

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS build id to resolve"
        required: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Resolve artifact URL (self-polls until the build finishes)
        env:
          BID: ${{ github.event.inputs.build_id }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 40); do
            if ! eas build:list --platform android --limit 30 --json --non-interactive \
                 > builds.json 2> list-err.txt; then
              echo "build:list failed (will retry):"; cat list-err.txt
              sleep 30; continue
            fi
            status=$(jq -r --arg id "$BID" '.[] | select(.id==$id) | .status' builds.json)
            url=$(jq -r --arg id "$BID" \
              '.[] | select(.id==$id) | (.artifacts.buildUrl // .artifacts.applicationArchiveUrl // "")' builds.json)
            echo "status=$status"
            if [ "$status" = "FINISHED" ] && [ -n "$url" ] && [ "$url" != "null" ]; then
              echo "ARTIFACT_URL>>>${url}<<<"
              exit 0
            fi
            if [ "$status" = "ERRORED" ] || [ "$status" = "CANCELED" ]; then
              echo "::error::build $BID ended as $status" >&2
              jq --arg id "$BID" '.[] | select(.id==$id) | {status, error}' builds.json
              exit 1
            fi
            sleep 30
          done
          echo "::error::timed out waiting for build $BID to finish" >&2
          exit 1
