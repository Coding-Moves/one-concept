name: Deploy Supabase API and worker to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The existing protected production environment requires an operator review.
    environment: production-schema
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require the current main commit and production target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if [ "$PRODUCTION_REF" != 'egdszjoesxlccauahmsx' ] || \
             [ -z "$STAGING_REF" ] || [ "$STAGING_REF" = "$PRODUCTION_REF" ] || \
             [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::A production-scoped token and distinct, reviewed project refs are required.'
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema verifier
        run: python -m pip install --requirement backend/requirements.txt
      - name: Verify production schema before deployment
        working-directory: backend
        env:
          PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          PRODUCTION_SCHEMA_DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
        run: |
          python -c 'from tools.apply_production_cutover import target_environment; target_environment(); print("production_connection=validated")'
          python -m app.workers.schema_check
          python -m tools.verify_supabase_cutover_schema
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Deploy API from this main commit
        run: supabase functions deploy api --project-ref "$PRODUCTION_REF"
      - name: Deploy worker from this main commit without activating Cron
        run: supabase functions deploy worker --project-ref "$PRODUCTION_REF"
      - name: Check worker boot and unsigned dispatch rejection
        env:
          WORKER_URL: https://${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}.supabase.co/functions/v1/worker
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              os.environ['WORKER_URL'], data=b'{}', method='POST',
              headers={'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status, body = response.status, response.read(128)
          except urllib.error.HTTPError as error:
              status, body = error.code, error.read(128)
          except Exception:
              status, body = 0, b''
          ok = status == 401 and body == b'{"error":"invalid_dispatch"}'
          print('production_worker_boot=' + ('ready' if ok else 'failed'))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Check production API health
        env:
          HEALTH_URL: https://${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}.supabase.co/functions/v1/api/health
        run: |
          python - <<'PY'
          import os
          import urllib.request

          try:
              with urllib.request.urlopen(os.environ['HEALTH_URL'], timeout=20) as response:
                  ok = response.status == 200
          except Exception:
              ok = False
          print('production_api_health=' + ('ready' if ok else 'failed'))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Require main to remain at the deployed commit
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
