# PRs check the operator ledger without production secrets. The separate,
# protected main-only job verifies actual database objects; the ledger alone
# cannot establish that SQL ran. Neither job applies migrations.
name: Migrations applied check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-schema:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Verify production schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-schema
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require current main revision
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verifier dependencies without production credentials
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check actual target schema without writing to the database
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
        run: python -m app.workers.schema_check

  check:
    # Explicit name so the reported check context is stable and descriptive
    # ("Migrations applied check") — it's a required status check on main.
    name: Migrations applied check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Flag migrations not recorded as applied to production
        working-directory: backend/migrations
        run: |
          ledger=applied.txt
          if [ ! -f "$ledger" ]; then
            echo "::error::$ledger is missing — the migrations ledger must exist."
            exit 1
          fi

          shopt -s nullglob
          missing=()
          for f in *.sql; do
            grep -qxF "$f" "$ledger" || missing+=("$f")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "✓ All backend/migrations/*.sql files are recorded as applied to production."
            exit 0
          fi

          {
            echo "## ⚠️ Migrations not applied to production"
            echo ""
            echo "These \`backend/migrations/*.sql\` files are **not** listed in \`applied.txt\`, so they may ship in the code without ever having been run on the production database:"
            echo ""
            for f in "${missing[@]}"; do echo "- \`$f\`"; done
            echo ""
            echo "**Before this release reaches main:** run each on prod —"
            echo "Supabase → SQL Editor, or \`psql \"\$DIRECT_URL\" -f backend/migrations/<file>\` —"
            echo "then add its filename to \`backend/migrations/applied.txt\` in this PR."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "::error::Unapplied migrations: ${missing[*]}"
          exit 1
