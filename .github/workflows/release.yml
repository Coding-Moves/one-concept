# Merging a release PR into main cuts a versioned release: the tag and the
# GitHub Release are created from the app version in mobile/app.json, with
# auto-generated notes. Re-runs are safe — an existing tag is left alone.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "v=$(python3 -c "import json; print(json.load(open('mobile/app.json'))['expo']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Create tag and release (if new)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.v }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "One Concept $TAG" \
            --generate-notes
