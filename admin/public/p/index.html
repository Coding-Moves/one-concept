<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared profile · One Concept</title>
  <link rel="stylesheet" href="/public-info.css">
  <script defer src="/public-config.js"></script>
  <script defer src="/public-profile.js"></script>
</head>
<body>
  <main>
    <p>ONE CONCEPT</p>
    <h1 id="name">Shared profile</h1>
    <p id="status" role="status">Loading profile…</p>
    <img id="avatar" alt="Shared profile photo" width="76" height="76" hidden>
    <p id="bio" hidden></p>
    <section id="highlights" hidden>
      <h2>Learning highlights</h2>
      <p id="streak" hidden></p>
      <p id="learning" hidden></p>
    </section>
    <section id="awards" hidden><h2>Achievements</h2><ul id="awards-list"></ul></section>
    <p><a id="open-app" href="#" hidden>Open in One Concept to connect</a></p>
  </main>
</body>
</html>
