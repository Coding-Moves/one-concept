name: Apply reviewed Supabase SQL to production

on:
  push:
    tags:
      - 'supabase-production-schema-cutover-*'

permissions:
  contents: read

concurrency:
  group: supabase-production-schema-cutover
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.ref, 'refs/tags/supabase-production-schema-cutover-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-schema
    env:
      PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      PRODUCTION_SCHEMA_DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
      PRODUCTION_BACKUP_REFERENCE: ${{ vars.SUPABASE_PRODUCTION_BACKUP_REFERENCE }}
      PRODUCTION_APPLY_CONFIRMATION: apply-0046-through-0130-to-egdszjoesxlccauahmsx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require tag to identify its exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "supabase-production-schema-cutover-${GITHUB_SHA}"
          test "$PRODUCTION_PROJECT_REF" = 'egdszjoesxlccauahmsx'
          test "$STAGING_PROJECT_REF" = 'zhrulokgngjceqgjkcmw'
          test -n "$PRODUCTION_SCHEMA_DIRECT_URL"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Read-only target and baseline check
        run: python backend/tools/apply_production_cutover.py --check
      - name: Apply ordered reviewed SQL only after backup reference and owner approval
        run: python backend/tools/apply_production_cutover.py --apply
      - name: Verify actual target schema after SQL
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
        run: |
          python -m app.workers.schema_check
          python -m tools.verify_supabase_cutover_schema
