name: Application quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# No path filters: required checks must finish even for documentation PRs.
# Pull requests receive no deployment, database, Expo or provider credentials.
jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check --select F,E9 app tests
      - name: Unit and disposable PostgreSQL 16 integration tests
        env:
          TEST_CONTAINER_ENGINE: docker
          TEST_REQUIRE_DATABASE: '1'
        run: python -m pytest -ra

  mobile:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
