# Never run PR code with a production connection. Environment secrets are only
# available to this main-only job; no input can substitute another checkout ref.
name: Production schema verification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify production schema
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-schema
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require current main revision
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verifier dependencies without production credentials
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check actual target schema without writing to the database
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_SCHEMA_DIRECT_URL }}
        run: python -m app.workers.schema_check
