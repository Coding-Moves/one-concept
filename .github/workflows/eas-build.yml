# Manually-triggered EAS Build for Android. Builds run on Expo's servers and
# count against the EAS build quota, so this never fires automatically.
#
# Requires the EXPO_TOKEN repository secret (Expo access token).
name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile from eas.json"
        type: choice
        default: preview
        options: [development, preview, staging-development, production]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Validate target public configuration
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          if [[ "$PROFILE" == development || "$PROFILE" == preview || "$PROFILE" == staging-development ]]; then
            APP_VARIANT=staging EXPO_PUBLIC_APP_VARIANT=staging eas env:exec preview 'node scripts/validate-public-config.cjs --release --variant=staging' --non-interactive
          elif [[ "$PROFILE" == production ]]; then
            APP_VARIANT=production EXPO_PUBLIC_APP_VARIANT=production eas env:exec production 'node scripts/validate-public-config.cjs --release --variant=production' --non-interactive
          fi

      - name: Build Android
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
