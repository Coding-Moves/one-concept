# OTA updates follow the branch model: merging mobile changes to develop
# publishes to the preview channel (preview-profile builds — the developer's
# own device), and a release merged to main publishes to production. Native
# changes (new native modules, app.json native config) need a new build
# instead — see mobile/DEPLOYMENT.md.
#
# Requires the EXPO_TOKEN repository secret (Expo access token). Until it is
# set, this workflow fails at the eas-update step and deploys nothing.
name: EAS Update (OTA)

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - "!mobile/**.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel"
        type: choice
        default: production
        options: [production, preview]

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # --environment pulls the EXPO_PUBLIC_* variables from EAS into the
      # bundle; without it the update ships with empty config and crashes.
      - name: Publish OTA update (production)
        if: github.ref == 'refs/heads/main' || github.event.inputs.channel == 'production'
        run: eas update --channel production --environment production --message "${{ github.event.head_commit.message || 'manual dispatch' }}" --non-interactive

      - name: Publish OTA update (preview)
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.event.inputs.channel == 'preview'
        run: eas update --channel preview --environment preview --message "${{ github.event.head_commit.message || 'manual dispatch' }}" --non-interactive
