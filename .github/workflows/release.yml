# Merging a release PR into main cuts a versioned release. The production OTA
# publishes FIRST; the tag and GitHub Release are created only if that publish
# succeeds, so a Release can never claim a version that never reached phones.
# (Railway deploys the backend independently on the same push — see
# mobile/DEPLOYMENT.md; it is not gated here.)
name: Release

on:
  push:
    branches: [main]

# One release at a time: two quick merges must not race the tag check.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ota:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Production first, then preview so preview devices are never left
      # behind a production release. --environment bundles the EXPO_PUBLIC_*
      # values; without it the update ships empty config and crashes.
      - name: Publish production OTA
        env:
          MSG: ${{ github.event.head_commit.message || 'release' }}
        run: eas update --channel production --environment production --message "$MSG" --non-interactive

      - name: Publish preview OTA
        env:
          MSG: ${{ github.event.head_commit.message || 'release' }}
        run: eas update --channel preview --environment preview --message "$MSG" --non-interactive

  release:
    needs: ota
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Explicit node (the ota job has its own) so the version read below does
      # not silently depend on whatever the runner image preinstalls.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read the version
        id: version
        run: echo "v=$(node -p "require('./mobile/app.config.js').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script,
          # so a version string can never inject shell.
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          set -euo pipefail

          # A blank or non-semver version means the read failed (e.g. someone
          # made app.config.js a dynamic function export) — fail loudly rather
          # than tag "vundefined" or cut a release nobody can find.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Could not read a valid version from mobile/app.config.js (got '${VERSION}')." >&2
            exit 1
          fi
          TAG="v${VERSION}"

          # A git tag already at this version means the release PR did not bump
          # mobile/app.config.js — fail so the omission is visible, not silent.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists — bump expo.version in the release PR." >&2
            exit 1
          fi

          # Generate the notes WITHOUT creating anything, prepend the install
          # path (OTA-only releases attach no APK), then create the release in
          # one mutating call — so the ls-remote guard above makes the whole
          # step safely re-runnable after a transient failure.
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
          {
            echo "**Install:** download the current APK from the \"Install the app\" section of the README. This release reaches installed apps over the air — no reinstall unless a native change shipped."
            echo
            echo "$notes"
          } > release-notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "One Concept $TAG" \
            --notes-file release-notes.md
