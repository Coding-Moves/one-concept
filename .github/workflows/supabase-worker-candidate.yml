name: Validate Supabase worker candidate in staging

on:
  push:
    tags:
      - 'supabase-worker-staging-batch-*'

permissions:
  contents: read

concurrency:
  group: supabase-worker-staging
  cancel-in-progress: false

jobs:
  stage_worker:
    runs-on: ubuntu-latest
    environment: supabase-staging
    env:
      STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_DIRECT_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      STAGING_WORKER_SIGNING_KEY: ${{ secrets.SUPABASE_STAGING_WORKER_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require reviewed staging target and scoped token
        run: |
          if [ "$STAGING_PROJECT_REF" != 'zhrulokgngjceqgjkcmw' ] || \
             [ -z "$PRODUCTION_PROJECT_REF" ] || \
             [ "$STAGING_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ] || \
             [ -z "$STAGING_DIRECT_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || \
             [ -z "$STAGING_WORKER_SIGNING_KEY" ]; then
            echo '::error::Worker staging target or credentials are not configured.'
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply and verify reviewed worker migrations
        run: python backend/tools/apply_staging_migrations.py --apply-incremental
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Configure staging-only Vault and Edge secrets
        run: python backend/tools/configure_staging_worker.py
      - name: Deploy candidate worker only to staging
        run: supabase functions deploy worker --project-ref "$STAGING_PROJECT_REF"
      - name: Install all worker schedules inactive in staging
        run: python backend/tools/install_staging_worker_cron.py
