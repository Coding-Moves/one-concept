# Publish the reviewed develop revision to the existing staging project only.
# Schema changes are applied through the separate protected staging migration path.
name: Deploy Supabase API and worker to staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      STAGING_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_DIRECT_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require current develop revision and exact staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/develop | cut -f1)" = "$GITHUB_SHA"
          if [[ "$STAGING_REF" != 'zhrulokgngjceqgjkcmw' || \
                "$PRODUCTION_REF" != 'egdszjoesxlccauahmsx' || \
                -z "$SUPABASE_ACCESS_TOKEN" || -z "$DIRECT_URL" ]]; then
            echo '::error::Use the reviewed staging project and staging-scoped credentials.'
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install read-only schema verifier
        run: python -m pip install --requirement backend/requirements.txt
      - name: Verify staging schema before deployment
        working-directory: backend
        run: |
          python -c 'import os; from tools.apply_staging_migrations import connection_environment; connection_environment(os.environ["STAGING_PROJECT_REF"], os.environ["PRODUCTION_PROJECT_REF"], os.environ["STAGING_DIRECT_URL"]); print("staging_connection=validated")'
          python -m app.workers.schema_check
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest
      - name: Deploy staging API and worker without changing Cron gates
        run: |
          set -euo pipefail
          supabase functions deploy api --project-ref "$STAGING_REF" --yes
          supabase functions deploy worker --project-ref "$STAGING_REF" --yes
      - name: Check staging API and worker boot
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = f"https://{os.environ['STAGING_REF']}.supabase.co/functions/v1"
          with urllib.request.urlopen(f'{base}/api/health', timeout=20) as response:
              healthy = response.status == 200 and json.load(response) == {
                  'status': 'ok', 'database': 'reachable'
              }
          request = urllib.request.Request(
              f'{base}/worker', data=b'{}', method='POST',
              headers={'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  worker_safe = response.status == 401
          except urllib.error.HTTPError as error:
              worker_safe = error.code == 401 and error.read(128) == b'{"error":"invalid_dispatch"}'
          print('staging_api=' + ('ready' if healthy else 'failed'))
          print('staging_worker=' + ('ready' if worker_safe else 'failed'))
          raise SystemExit(0 if healthy and worker_safe else 1)
          PY
